name: Daily Log

on:
  push:
    branches: [dev, main]

jobs:
  log:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate daily log
        run: python scripts/daily_log.py